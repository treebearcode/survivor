<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Starfall Survivor</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="game"></div>
<!-- Shown ONLY if the game never starts (library load failure). -->
<div id="bootfail" hidden>
  The game couldn&rsquo;t start &mdash; a file it needs didn&rsquo;t load.
  Check your connection, then close and reopen this page.
</div>
<!-- Shown ONLY if the running game throws an error (e.g. a freeze).
     A frozen game with no message is impossible to debug, so the
     error is printed here instead of failing silently. -->
<div id="rerr" hidden
  style="position:fixed;top:0;left:0;right:0;z-index:9999;background:#7f1d1d;color:#fff;font:13px monospace;padding:8px;white-space:pre-wrap;word-break:break-word;"></div>

<script>
  // Boot guard: if Phaser never appears, show the message above instead
  // of a silent blank page.
  window.__survivorBoot = { booted: false };
  window.__survivorShowFail = function (msg) {
    var el = document.getElementById("bootfail");
    if (!el || window.__survivorBoot.booted) return;
    el.hidden = false;
    if (msg) {
      var p = document.createElement("p");
      p.style.cssText = "font-size:13px;opacity:.75;word-break:break-word;";
      p.textContent = String(msg);
      el.appendChild(p);
    }
  };
  window.addEventListener("error", function (e) {
    if (!window.__survivorBoot.booted) {
      window.__survivorShowFail(e.message);
      return;
    }
    // After boot: a runtime error would otherwise freeze the game
    // with no visible trace, so print it in the red banner above.
    var el = document.getElementById("rerr");
    if (el) {
      el.hidden = false;
      el.textContent = "Game error: " + e.message +
        " @ " + (e.filename || "?") + ":" + (e.lineno || "?");
    }
  });
  window.addEventListener("unhandledrejection", function (e) {
    var el = document.getElementById("rerr");
    if (el && window.__survivorBoot.booted) {
      el.hidden = false;
      el.textContent = "Game error: " + (e.reason && e.reason.message
        ? e.reason.message : String(e.reason));
    }
  });
</script>

<!-- Phaser 3.60, bundled locally. If this copy ever fails to load,
     the boot script below falls back to the CDN copy.
     NOTE: Phaser is loaded as a CLASSIC script (a global), not a module —
     scene.js uses window.Phaser. -->
<script src="assets/phaser.min.js"></script>

<!-- The game itself, as ES modules. Dev directly in this folder — no
     build step. Modules do NOT work by double-clicking (file:// blocks
     imports): run a local server from docs/, e.g. `python3 -m http.server`,
     or use VSCode Live Server. GitHub Pages serves these files as-is. -->
<script type="module" src="./main.js" onerror="window.__survivorShowFail('Could not load the game module — serve this folder over HTTP (python3 -m http.server in docs/), not file://.')"></script>

<script>
  // Start the game once Phaser is available.
  // main.js defines window.__startSurvivor() but does NOT auto-start —
  // this is the one place that decides when to boot.
  //
  // <script type="module"> is deferred, so it runs after this classic
  // inline script during parsing. Waiting for DOMContentLoaded (which
  // fires after deferred modules) is what makes window.__startSurvivor
  // exist by the time we call it. main.js also runs the same start()
  // and sets booted=true, so this handler no-ops if the game is
  // already running — the game is created exactly once either way.
  document.addEventListener("DOMContentLoaded", function () {
    function start() {
      if (window.__survivorBoot.booted) return;
      if (typeof window.__startSurvivor === "function" && window.__startSurvivor()) {
        window.__survivorBoot.booted = true;
      } else {
        window.__survivorShowFail("Phaser loaded but the game did not start.");
      }
    }
    if (typeof Phaser !== "undefined") {
      start();
    } else {
      // Local copy failed — try the CDN, once.
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js";
      s.onload = start;
      s.onerror = function () {
        window.__survivorShowFail("Could not load Phaser (local copy or CDN).");
      };
      document.head.appendChild(s);
    }
  });
</script>
</body>
</html>
